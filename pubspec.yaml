name: nextrep
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.6.2
  firebase_core: ^3.15.1
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^2.6.1
  font_awesome_flutter: ^10.8.0
  fpdart: ^1.1.1
  gif: ^2.3.0
  google_fonts: ^6.2.1
  google_sign_in: ^7.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  intl: ^0.20.2
  lottie: ^3.3.1
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  shared_preferences: ^2.5.3
  youtube_player_flutter: ^9.1.2

dev_dependencies:
  build_runner: ^2.3.3
  hive_generator: ^2.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/core/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/core/
    - assets/welcome_screen/
    - assets/sign_in/
    - assets/lottie/genders/
    - assets/experience/
    - assets/exercise_images/
    - assets/data/
    - assets/workouts/
